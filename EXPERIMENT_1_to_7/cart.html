<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart Page</title>
<style>
body  { font-family: Arial, sans-serif; margin: 24px; }
h2    { text-align: center; color: #5a2a08; }
table { width: 90%; margin: 0 auto; border-collapse: collapse; }
th, td { border: 1px solid #999; padding: 9px; text-align: center; }
th    { background: #fdebd3; }
.total { font-weight: bold; background: #f6f6f6; }
</style>
</head>
<body>
<h2>Your Cart</h2>
<table>
<tr><th>Book Name</th><th>Price</th><th>Quantity</th><th>Amount</th></tr>
<tr><td>Introduction to Algorithms</td><td>$40.5</td><td>2</td><td>$81</td></tr>
<tr><td>The C Programming Language</td><td>$63</td><td>1</td><td>$63</td></tr>
<tr class="total">
<td colspan="3">Total Amount</td><td>$144</td>
</tr>
</table>
</body>
</html>
