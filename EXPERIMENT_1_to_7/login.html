<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
body  { font-family: Arial, sans-serif; margin: 24px; }
h2    { text-align: center; color: #5a2a08; }
table { margin: 30px auto; border-spacing: 12px; }
input[type="text"], input[type="password"] { width: 220px; padding: 5px; }
.btn  { text-align: center; }
</style>
</head>
<body>
<h2>Login Page</h2>
<form action="#" method="post">
<table>
<tr>
<td>User Name:</td>
<td><input type="text" name="username"></td>
</tr>
<tr>
<td>Password:</td>
<td><input type="password" name="password"></td>
</tr>
<tr>
<td colspan="2" class="btn">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>
</table>
</form>
</body>
</html>
